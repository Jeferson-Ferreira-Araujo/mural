name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (tsc)
        run: npx tsc --noEmit
      - name: Chaves usadas no código existem no catálogo
        run: node scripts/check-keys.mjs
      - name: Catálogos de tradução (mesmas chaves em pt, en e es)
        run: node scripts/check-messages.mjs
